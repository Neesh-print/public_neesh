name: CI

# Runs on every push and pull request. Vercel still deploys from git; this
# is the gate that tells you a commit is safe before you promote it. To make
# it block merges, mark the "checks" job as required in the repository's
# branch protection settings.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Empty values win over the committed .env.production, so the build
      # and the smoke run never touch the production database or send email.
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      RESEND_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Smoke test the build
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npm run smoke
